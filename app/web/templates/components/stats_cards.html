<!-- Tarjetas de Métricas — Diseño Uniforme con Misma Fuente y Proporciones -->
<div class="row g-3">
    <!-- Total Entradas -->
    <div class="col-sm-6 col-xl-3">
        <div class="stat-card-sg">
            <div class="d-flex align-items-center justify-content-between mb-1">
                <span class="stat-label-sg">Total Entradas</span>
                <i class="bi bi-gift text-secondary fs-6 opacity-75"></i>
            </div>
            <div class="stat-value-sg">
                {{ total_entradas }}
            </div>
        </div>
    </div>
    
    <!-- Puntos Gastados -->
    <div class="col-sm-6 col-xl-3">
        <div class="stat-card-sg">
            <div class="d-flex align-items-center justify-content-between mb-1">
                <span class="stat-label-sg">Puntos Gastados</span>
                <i class="bi bi-coin text-secondary fs-6 opacity-75"></i>
            </div>
            <div class="stat-value-sg">
                {{ total_puntos }} <span class="fs-6 fw-normal text-muted">P</span>
            </div>
        </div>
    </div>
    
    <!-- Entradas Hoy -->
    <div class="col-sm-6 col-xl-3">
        <div class="stat-card-sg">
            <div class="d-flex align-items-center justify-content-between mb-1">
                <span class="stat-label-sg">Entradas Hoy</span>
                <i class="bi bi-check2-circle text-secondary fs-6 opacity-75"></i>
            </div>
            <div class="stat-value-sg">
                {{ entradas_hoy }}
            </div>
        </div>
    </div>
    
    <!-- Última Ejecución (Misma fuente y proporciones que el resto) -->
    <div class="col-sm-6 col-xl-3">
        <div class="stat-card-sg">
            <div class="d-flex align-items-center justify-content-between mb-1">
                <span class="stat-label-sg">Última Ejecución</span>
                <i class="bi bi-clock-history text-secondary fs-6 opacity-75"></i>
            </div>
            <div class="stat-value-sg" style="font-size: 1.15rem; font-weight: 700; color: #ffffff;">
                {% if ultima_run and ultima_run.started_at %}
                    {{ ultima_run.started_at.strftime('%d/%m/%Y %H:%M:%S') }}
                {% else %}
                    <span class="text-muted fs-6 fw-normal">Sin registros</span>
                {% endif %}
            </div>
        </div>
    </div>
</div>
