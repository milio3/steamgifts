<!-- Tarjetas de estadísticas del dashboard -->
<div class="row g-4">
    <!-- Total Entradas -->
    <div class="col-sm-6 col-xl-3">
        <div class="card h-100 border-secondary bg-dark-steam-light shadow-sm stat-card">
            <div class="card-body d-flex align-items-center">
                <div class="flex-shrink-0 me-3">
                    <div class="stat-icon-wrapper stat-icon-primary fs-3">
                        <i class="bi bi-gift-fill"></i>
                    </div>
                </div>
                <div>
                    <p class="text-muted mb-1 small fw-bold text-uppercase" style="letter-spacing: 0.5px;">Total Entradas</p>
                    <h3 class="mb-0 text-white fw-bold">{{ total_entradas }}</h3>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Puntos Gastados -->
    <div class="col-sm-6 col-xl-3">
        <div class="card h-100 border-secondary bg-dark-steam-light shadow-sm stat-card">
            <div class="card-body d-flex align-items-center">
                <div class="flex-shrink-0 me-3">
                    <div class="stat-icon-wrapper stat-icon-warning fs-3">
                        <i class="bi bi-coin"></i>
                    </div>
                </div>
                <div>
                    <p class="text-muted mb-1 small fw-bold text-uppercase" style="letter-spacing: 0.5px;">Puntos Gastados</p>
                    <h3 class="mb-0 text-warning fw-bold">{{ total_puntos }}P</h3>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Entradas Hoy -->
    <div class="col-sm-6 col-xl-3">
        <div class="card h-100 border-secondary bg-dark-steam-light shadow-sm stat-card">
            <div class="card-body d-flex align-items-center">
                <div class="flex-shrink-0 me-3">
                    <div class="stat-icon-wrapper stat-icon-success fs-3">
                        <i class="bi bi-calendar-check"></i>
                    </div>
                </div>
                <div>
                    <p class="text-muted mb-1 small fw-bold text-uppercase" style="letter-spacing: 0.5px;">Entradas Hoy</p>
                    <h3 class="mb-0 text-white fw-bold">{{ entradas_hoy }}</h3>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Última ejecución -->
    <div class="col-sm-6 col-xl-3">
        <div class="card h-100 border-secondary bg-dark-steam-light shadow-sm stat-card">
            <div class="card-body d-flex align-items-center">
                <div class="flex-shrink-0 me-3">
                    <div class="stat-icon-wrapper stat-icon-info fs-3">
                        <i class="bi bi-clock-history"></i>
                    </div>
                </div>
                <div>
                    <p class="text-muted mb-1 small fw-bold text-uppercase" style="letter-spacing: 0.5px;">Última Ejecución</p>
                    <h6 class="mb-0 text-light fw-semibold">
                        {% if ultima_run %}
                            {{ ultima_run.started_at.strftime('%d/%m/%Y %H:%M') }}
                        {% else %}
                            <span class="text-muted">Nunca</span>
                        {% endif %}
                    </h6>
                </div>
            </div>
        </div>
    </div>
</div>
