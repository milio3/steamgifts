<!-- Recuadro de Cuenta y Puntos (Mismo tamaño que botón Iniciar Ejecución, sin botón actualizar ni nivel) -->
{% if not configured %}
    <a href="/config" class="btn-sg-account-box text-decoration-none" title="Configurar Cookie PHPSESSID">
        <i class="bi bi-person-fill text-secondary me-2"></i>
        <span class="small text-warning">Configurar</span>
    </a>
{% elif not valid %}
    <div class="btn-sg-account-box" title="{{ error or 'Sesión no válida o expirada' }}">
        <i class="bi bi-person-fill text-secondary me-2"></i>
        <span class="small text-danger">Sin conexión</span>
    </div>
{% else %}
    <div class="btn-sg-account-box" title="Cuenta conectada a SteamGifts">
        <!-- Icono de usuario azul cuando hay datos -->
        <i class="bi bi-person-fill text-info me-2 fs-6"></i>
        <span class="fw-bold text-white small me-1">{{ username }}</span>
        <span class="small font-monospace" style="color: #96b847; font-weight: 600;">{{ points }}p</span>
    </div>
{% endif %}
