<!-- Indicador de estado del sistema (informativo, no interactivo) -->
{% if running %}
    <div class="status-pill status-pill-running" title="El bot está procesando sorteos activamente">
        <span class="status-dot"></span>
        <span>Bot en ejecución...</span>
    </div>
{% else %}
    <div class="status-pill status-pill-idle" title="El bot está en espera">
        <span class="status-dot"></span>
        <span>Sistema en espera</span>
    </div>
{% endif %}
