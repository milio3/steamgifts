{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="m-0"><i class="bi bi-speedometer2 text-primary"></i> Panel de Control</h2>
</div>

<!-- Tarjetas de Métricas -->
<div id="stats-container" hx-get="/partials/stats" hx-trigger="load" hx-swap="innerHTML">
    <div class="d-flex justify-content-center my-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Cargando métricas...</span>
        </div>
    </div>
</div>

<div class="row mt-4">
    <!-- Controles de Ejecución -->
    <div class="col-lg-4 mb-4">
        <div class="card h-100 border-secondary bg-dark-steam-light shadow-sm">
            <div class="card-header border-secondary bg-transparent py-3">
                <h5 class="card-title m-0"><i class="bi bi-rocket-takeoff text-success"></i> Ejecución Manual</h5>
            </div>
            <div class="card-body">
                <form id="run-bot-form" hx-post="/partials/run-bot" hx-target="#run-feedback" hx-swap="innerHTML">
                    <p class="text-muted small mb-3">Selecciona las categorías en orden de prioridad:</p>
                    
                    <div class="d-flex flex-column gap-2 mb-4">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" role="switch" id="cat-wishlist" name="categories" value="wishlist" checked>
                            <label class="form-check-label badge-wishlist" for="cat-wishlist">🌟 Wishlist (Prioridad 1)</label>
                        </div>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" role="switch" id="cat-dlc" name="categories" value="dlc" checked>
                            <label class="form-check-label badge-dlc" for="cat-dlc">📦 DLCs (Prioridad 2)</label>
                        </div>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" role="switch" id="cat-group" name="categories" value="group" checked>
                            <label class="form-check-label badge-group" for="cat-group">👥 Grupos (Prioridad 3)</label>
                        </div>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" role="switch" id="cat-multiple" name="categories" value="multiple_copies" checked>
                            <label class="form-check-label badge-multiple" for="cat-multiple">📋 Múltiples Copias (Prioridad 4)</label>
                        </div>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" role="switch" id="cat-new" name="categories" value="new" checked>
                            <label class="form-check-label badge-new" for="cat-new">🆕 Nuevos (Prioridad 5)</label>
                        </div>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg btn-run-gradient shadow fw-bold" id="btn-run-bot">
                            <i class="bi bi-play-fill fs-5"></i> Ejecutar Bot
                        </button>
                    </div>

                    <div id="run-feedback" class="mt-3"></div>
                </form>
            </div>
        </div>
    </div>
    
    <!-- Últimas entradas -->
    <div class="col-lg-8 mb-4">
        <div class="card h-100 border-secondary bg-dark-steam-light shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center border-secondary bg-transparent py-3">
                <h5 class="card-title m-0"><i class="bi bi-gift text-warning"></i> Últimas 10 Entradas</h5>
                <a href="/entries" class="btn btn-sm btn-outline-light">Ver historial completo</a>
            </div>
            <div class="card-body p-0">
                <div id="latest-entries-container" hx-get="/partials/latest-entries" hx-trigger="load" hx-swap="innerHTML">
                    <div class="d-flex justify-content-center my-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Cargando entradas...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
