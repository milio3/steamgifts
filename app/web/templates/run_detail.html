{% extends "base.html" %}

{% block title %}Detalle de Ejecución #{{ run_id }}{% endblock %}

{% block content %}
<div class="mb-4">
    <a href="/runs" class="text-decoration-none text-muted mb-2 d-inline-block"><i class="bi bi-arrow-left"></i> Volver a Ejecuciones</a>
    <h2 class="m-0"><i class="bi bi-info-circle text-primary"></i> Detalle de Ejecución #{{ run_id }}</h2>
</div>

<!-- Resumen de ejecución -->
<div id="run-detail-summary" hx-get="/partials/runs/{{ run_id }}/summary" hx-trigger="load" hx-swap="innerHTML">
    <div class="d-flex justify-content-center my-4">
        <div class="spinner-border text-primary" role="status"></div>
    </div>
</div>

<h4 class="mt-5 mb-3"><i class="bi bi-list-check text-success"></i> Entradas realizadas en esta ejecución</h4>
<!-- Entradas de la ejecución -->
<div class="card border-secondary bg-dark-steam-light shadow-sm">
    <div class="card-body p-0">
        <div id="run-entries-container" hx-get="/partials/entries-table?run_id={{ run_id }}" hx-trigger="load" hx-swap="innerHTML">
            <div class="d-flex justify-content-center my-5">
                <div class="spinner-border text-primary" role="status"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
