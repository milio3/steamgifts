{% extends "base.html" %}

{% block title %}Ejecuciones{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="m-0"><i class="bi bi-clock-history text-primary"></i> Registro de Ejecuciones</h2>
</div>

<div class="card border-secondary bg-dark-steam-light shadow-sm">
    <div class="card-body p-0">
        <div id="runs-table-container" hx-get="/partials/runs-table" hx-trigger="load" hx-swap="innerHTML">
            <div class="d-flex justify-content-center my-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Cargando ejecuciones...</span>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
