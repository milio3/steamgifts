{% extends "base.html" %}

{% block title %}Ejecuciones{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom" style="border-color: #2a475e !important;">
    <h2 class="h4 fw-bold text-white m-0 d-flex align-items-center gap-2">
        <i class="bi bi-clock-history text-info"></i> Registro de Ejecuciones
    </h2>
</div>

<!-- Tabla Paginada de Ejecuciones (Sin scrollbar, mismo formato que Historial) -->
<div class="card card-sg">
    <div class="card-body p-0">
        <div id="runs-table-container" 
             hx-get="/partials/runs-table" 
             hx-trigger="load" 
             hx-swap="innerHTML">
            <div class="d-flex justify-content-center my-5 py-4">
                <div class="spinner-border text-info" role="status">
                    <span class="visually-hidden">Cargando ejecuciones...</span>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
