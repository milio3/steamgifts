<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SteamGifts Bot{% endblock %} | 🎮 SteamGifts Bot</title>
    
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-dark-steam text-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark-nav sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="/">
                <i class="bi bi-controller fs-4 text-primary"></i>
                SteamGifts Bot
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if 'dashboard' in request.url.path %}active{% endif %}" href="/dashboard">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if 'entries' in request.url.path %}active{% endif %}" href="/entries">
                            <i class="bi bi-list-ul"></i> Historial
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if 'runs' in request.url.path %}active{% endif %}" href="/runs">
                            <i class="bi bi-clock-history"></i> Ejecuciones
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if 'config' in request.url.path %}active{% endif %}" href="/config">
                            <i class="bi bi-gear"></i> Configuración
                        </a>
                    </li>
                </ul>
                
                <div class="d-flex align-items-center gap-3">
                    <!-- Estado del bot (cargado via HTMX) -->
                    <div id="bot-status-container" hx-get="/partials/bot-status" hx-trigger="load, every 5s" hx-swap="innerHTML">
                        <span class="badge bg-secondary"><i class="bi bi-arrow-repeat spin"></i> Conectando...</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container my-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer mt-auto py-3 bg-dark-nav text-muted text-center border-top border-secondary">
        <div class="container">
            <small>🎮 SteamGifts Auto-Enter Bot | v1.0.0 | <i class="bi bi-code-slash"></i> con ❤️</small>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
