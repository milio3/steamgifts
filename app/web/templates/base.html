<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SteamGifts Bot{% endblock %} | SteamGifts</title>
    
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">

    <!-- Custom CSS SteamGifts Dark -->
    <link rel="stylesheet" href="/static/css/style.css?v=2.0.0">
</head>
<body>

    <!-- Cabecera Superior: Logo + Enlaces Centrados + Cuenta & Botón Ejecución -->
    <nav class="navbar navbar-expand-lg navbar-steam sticky-top">
        <div class="sg-container d-flex align-items-center justify-content-between gap-3">
            <!-- Logo a la izquierda -->
            <a class="navbar-brand m-0 text-nowrap" href="/dashboard">
                <i class="bi bi-gift-fill text-info fs-5"></i>
                <span>SteamGifts</span>
                <span class="logo-badge">Bot</span>
            </a>
            
            <button class="navbar-toggler border-0 p-1 text-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse justify-content-between align-items-center" id="navbarContent">
                <!-- Enlaces centrados en la cabecera -->
                <ul class="navbar-nav mx-auto align-items-center gap-1 my-2 my-lg-0">
                    <li class="nav-item">
                        <a class="nav-link {% if 'dashboard' in request.url.path or request.url.path == '/' %}active{% endif %}" href="/dashboard">
                            <i class="bi bi-speedometer2 me-1"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if 'entries' in request.url.path %}active{% endif %}" href="/entries">
                            <i class="bi bi-ticket-perforated me-1"></i> Historial
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if 'runs' in request.url.path %}active{% endif %}" href="/runs">
                            <i class="bi bi-clock-history me-1"></i> Ejecuciones
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if 'config' in request.url.path %}active{% endif %}" href="/config">
                            <i class="bi bi-gear me-1"></i> Configuración
                        </a>
                    </li>
                </ul>

                <!-- Espacio a la derecha: Recuadro de Cuenta y Botón Iniciar Ejecución -->
                <div class="d-flex align-items-center gap-2 mt-2 mt-lg-0 ms-lg-2">
                    <!-- Recuadro Cuenta: Carga automática al iniciar la web -->
                    <div id="account-pill-container"
                         hx-get="/partials/account-points"
                         hx-trigger="load, refreshAccount from:body, every 20s"
                         hx-swap="innerHTML">
                        <div class="btn-sg-account-box text-muted">
                            <i class="bi bi-person-fill text-secondary me-2 fs-6"></i>
                            <span class="small">Cargando...</span>
                        </div>
                    </div>

                    <!-- Botón Iniciar Ejecución Verde Steam -->
                    <form id="run-bot-form" hx-post="/partials/run-bot" hx-target="#run-feedback" hx-swap="innerHTML" class="m-0">
                        <button type="submit" 
                                class="btn btn-sg-enter" 
                                id="btn-run-bot"
                                title="Iniciar ejecución del bot con las categorías configuradas">
                            <i class="bi bi-play-fill fs-5" style="line-height: 1;"></i>
                            <span>Iniciar Ejecución</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <!-- Feedback global de ejecución -->
    <div class="sg-container mt-2">
        <div id="run-feedback"></div>
    </div>

    <!-- Main Content en Contenedor Amigable Centrado (1240px) -->
    <main class="sg-container my-3">
        {% block content %}{% endblock %}
    </main>

    <!-- Modal Global: Detalle de Ejecución -->
    <div class="modal fade" id="runDetailModal" tabindex="-1" aria-labelledby="runDetailModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content modal-content-sg border-0" id="runDetailModalBody">
                <div class="p-5 text-center text-muted">
                    <div class="spinner-border text-info spinner-border-sm mb-2" role="status"></div>
                    <div>Cargando detalle de la sesión...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Estilo SteamGifts -->
    <footer class="footer mt-auto py-3 text-muted text-center" style="border-top: 1px solid #2a475e; background: #171a21;">
        <div class="sg-container">
            <small style="color: #6a7d8e;">SteamGifts Auto-Enter Bot &bull; Basado en SteamGifts.com</small>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script type="module" src="/static/js/app.js?v=2.0.0"></script>
</body>
</html>
