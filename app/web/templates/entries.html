{% extends "base.html" %}

{% block title %}Historial de Entradas{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom" style="border-color: #2a475e !important;">
    <h2 class="h4 fw-bold text-white m-0 d-flex align-items-center gap-2">
        <i class="bi bi-ticket-perforated text-info"></i> Historial de Entradas
    </h2>
</div>

<!-- Filtros Dinámicos (Sin botones, sin rango de fechas, con buscador en tiempo real) -->
<div class="card card-sg mb-3">
    <div class="card-body p-3">
        <form id="filters-form" class="row g-2 align-items-center">
            <!-- Buscador por Nombre de Juego -->
            <div class="col-md-8">
                <div class="input-group">
                    <span class="input-group-text border-end-0 text-muted" style="background: #17212b; border-color: #2a475e;">
                        <i class="bi bi-search"></i>
                    </span>
                    <input type="search" 
                           id="search-input" 
                           name="search" 
                           class="form-control border-start-0" 
                           placeholder="Buscar por nombre de juego..."
                           autocomplete="off"
                           hx-get="/partials/entries-table" 
                           hx-trigger="input changed delay:300ms, search" 
                           hx-target="#entries-table-container"
                           hx-include="#filters-form">
                </div>
            </div>

            <!-- Selector Dinámico de Categoría -->
            <div class="col-md-4">
                <div class="input-group">
                    <span class="input-group-text border-end-0 text-muted" style="background: #17212b; border-color: #2a475e;">
                        <i class="bi bi-tag"></i>
                    </span>
                    <select id="category" 
                            name="category" 
                            class="form-select border-start-0"
                            hx-get="/partials/entries-table" 
                            hx-trigger="change" 
                            hx-target="#entries-table-container"
                            hx-include="#filters-form">
                        <option value="">Todas las categorías</option>
                        <option value="wishlist">Wishlist</option>
                        <option value="dlc">DLC</option>
                        <option value="group">Group</option>
                        <option value="Multiple Copies">Multiple Copies</option>
                        <option value="recommended">Recommended</option>
                        <option value="new">New</option>
                        <option value="all">All</option>
                    </select>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- Contenedor de la Tabla Paginada (Carga instantánea) -->
<div class="card card-sg">
    <div class="card-body p-0">
        <div id="entries-table-container" hx-swap="innerHTML">
            {% include "components/entries_table.html" %}
        </div>
    </div>
</div>
{% endblock %}
